apiVersion: v1
kind: Namespace
metadata:
  name: ns-hernan-contreras

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-hernan-contreras
  namespace: ns-hernan-contreras
data:
  AMBIENTE: "produccion"

---
apiVersion: v1
kind: Secret
metadata:
  name: secret-hernan-contreras
  namespace: ns-hernan-contreras
type: Opaque
stringData:
  API_KEY: "xxx_XXxXXXXxXXxxXxxXXXXxxxXxXXXxXxxxxXXX"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-hernan-contreras
  namespace: ns-hernan-contreras
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-hernan-contreras
  template:
    metadata:
      labels:
        app: app-hernan-contreras
    spec:
      containers:
        - name: app-hernan-contreras
          image: docker.io/hernancontreras/tarea-final:hernan-contreras
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-hernan-contreras
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-hernan-contreras
                  key: API_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: svc-hernan-contreras
  namespace: ns-hernan-contreras
spec:
  selector:
    app: app-hernan-contreras
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-hernan-contreras
  namespace: ns-hernan-contreras
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-hernan-contreras
  namespace: ns-hernan-contreras
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer-hernan-contreras