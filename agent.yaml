apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins

  containers:
    - name: node
      image: node:24-alpine
      command:
        - sh
        - -c
        - cat
      tty: true

    - name: docker
      image: docker:27-cli
      command:
        - sh
        - -c
        - cat
      tty: true
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375

    - name: dind
      image: docker:27-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      args:
        - --host=tcp://0.0.0.0:2375
        - --host=unix:///var/run/docker.sock

    - name: kubectl
      image: bitnami/kubectl:latest
      command:
        - sh
        - -c
        - cat
      tty: true